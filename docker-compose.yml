services:
  ollama:
    image: ollama/ollama:latest
    container_name: celebrimbot-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          memory: 6G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["with-ollama"]

  model-loader:
    image: ollama/ollama:latest
    container_name: celebrimbot-model-loader
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      sh -c "
        ollama pull qwen2.5-coder:1.5b &&
        ollama pull qwen2.5-coder:7b &&
        echo 'Models ready'
      "
    environment:
      - OLLAMA_HOST=ollama:11434
    profiles: ["with-ollama"]

  celebrimbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celebrimbot
    ports:
      - "16180:16180"
    environment:
      - CELEBRIMBOT_PORT=16180
      - CELEBRIMBOT_MODEL_UNLOAD_TIMEOUT=300
    volumes:
      - celebrimbot_models:/root/.celebrimbot/models
      - ./projects:/workspace
    working_dir: /workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:16180/api/version"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Open WebUI — optional. Start with: docker compose --profile ui up
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: celebrimbot-webui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://celebrimbot:16180
      - WEBUI_AUTH=false
    depends_on:
      celebrimbot:
        condition: service_healthy
    volumes:
      - webui_data:/app/backend/data
    profiles: ["ui"]

volumes:
  ollama_data:
  celebrimbot_models:
  webui_data:
